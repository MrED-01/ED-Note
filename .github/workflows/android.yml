name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_LISANS_TOKEN: ${{ secrets.LISANS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Web files (minified) into the app
        run: |
          npm run build
          npx cap sync android

      - name: Signing key
        run: |
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
          echo "Secret uzunluğu: ${#CLEAN} (3468 olmalı), başı: ${CLEAN:0:12} (MIIKJAIBAzCC olmalı)"
          printf '%s' "$CLEAN" | base64 -d > android/app/ednote.keystore
          if ! keytool -list -keystore android/app/ednote.keystore -storepass "$PW" > /dev/null 2>&1; then
            echo "::error::İmza anahtarı açılamadı. ANDROID_KEYSTORE_BASE64 ya da ANDROID_KEYSTORE_PASSWORD yanlış."
            exit 1
          fi
          echo "İmza anahtarı doğru."
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EDNOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk "ED-Note-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ED-Note-APK
          path: ED-Note-*.apk
          retention-days: 30

      - name: Publish update
        if: env.HAS_LISANS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.LISANS_TOKEN }}
          MSG: ${{ github.event.head_commit.message }}
          RUN: ${{ github.run_number }}
        run: |
          VER=$(grep -oP 'APP_VERSION = "\K[^"]+' app.js)
          TAG="v${VER}-${RUN}"
          NOTES=$(printf '%s' "$MSG" | head -n1)
          case "$NOTES" in ""|"Add files via upload"|Update*|Create*|Delete*|Merge*) NOTES="";; esac
          cp "ED-Note-${RUN}.apk" ED-Note.apk
          gh release create "$TAG" ED-Note.apk --repo MrED-01/ednote-lisans --title "ED Note $VER ($RUN)" --notes "${NOTES:-ED Note $VER}" --latest
          URL="https://github.com/MrED-01/ednote-lisans/releases/download/$TAG/ED-Note.apk"
          gh api repos/MrED-01/ednote-lisans/contents/liste.json > cur.json
          SHA=$(jq -r .sha cur.json)
          jq -r .content cur.json | base64 -d > liste.json
          jq --argjson b "$RUN" --arg v "$VER" --arg u "$URL" --arg n "$NOTES" '.latest = {build:$b, version:$v, url:$u, notes:$n}' liste.json > new.json
          gh api -X PUT repos/MrED-01/ednote-lisans/contents/liste.json -f message="Sürüm $VER ($RUN)" -f sha="$SHA" -f content="$(base64 -w0 new.json)"
