name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Web files (minified) into the app
        run: |
          npm run build
          npx cap sync android

      - name: Signing key
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/ednote.keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          EDNOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk "ED-Note-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ED-Note-APK
          path: ED-Note-*.apk
          retention-days: 30
